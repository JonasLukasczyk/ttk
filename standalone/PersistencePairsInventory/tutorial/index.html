         // https://htmlcolorcodes.com/
         // http://colorbrewer2.org/#type=diverging&scheme=RdYlBu&n=9
         let DEV = false ;

         function customColor(v, pp, max_persistence_pairs) {
             let green = ["#edf8e9", "bae4b3", "#74c476", "#31a354", "#006d2c"];  // from light to dark
             let gray = ["#f7f7f7", "#d9d9d9", "#bdbdbd", "#969696", "#636363"] ;
             let red = ["#fee5d9", "#fcae91", "#fb6a4a", "#de2d26", "#a50f15"] ; 
             let range_color = green ;
             if ( v >= 0 && v < 0.3 ) {
                range_color = red ;
             } else if ( v >= 0.3 && v < 0.6 ) {
                range_color = gray ;
             } else {
                range_color = green ;
             }

             if ( pp == 0 ) {
                return "white";
             }

             return range_color[Math.ceil(pp / ( max_persistence_pairs / 5 )) - 1] ;  
             
         }
         
         function getArray(n) {
             let ans = [] ;
             for (let i = 0; i < n; i ++) {
                 ans.push("" + i) ;
             }
             return ans ;
         }

         function calculateReliability(items, iComponent, max_persistence_pairs) {
            var sum = 0 ;
            var items = items.slice(iComponent, items.length) ;
            for (var i = 0; i < items.length; i ++) {
                sum += items[i] ;
            }
            if (Math.max(...items) == 0 ) {
                return 1 ;
            }
            return sum / (items.length * Math.max(...items)) ;
         }

         function renderHistogram(extent, data, nComponents, iComponent, socket) {
             Window.extent = extent ;
             Window.data = data ;
             Window.nComponents = nComponents ;

             $("#my_dataviz").html("") ;
             let w = extent[1] + 1 ;
             let h = extent[3] + 1 ;
             let myGroups = getArray(w) ;
             let myVars = getArray(h) ;
         
             let width = 901 ;
             let thx = 64 ;
             let svg = d3.select("#my_dataviz")
                         .append("svg")
                         .attr("width", width)
                         .attr("height", width * h / w - thx )
                         .attr("transform",
                                  "translate( 0, 0 )");
             let x = d3.scaleBand()
                         .range([ 0, width ])
                         .domain(myGroups)
                         .padding(0.01);
             
             // FLAG, get the max_persisitence_pairs
             var txt = $("#threshold").val() ;
             var max_persistence_pairs = 0 ;
             let vvv = Math.ceil(parseFloat(txt) / ( Window.persistence_num / Window.magnitude_num)) ;
             if ( txt.replace(" ", "") === "" ) {
                vvv = 0 ;
             }

             for (let i = 0; i < data.length; i ++ ) {
                if ( i % nComponents >= vvv) {
                    if ( data[i] > max_persistence_pairs ) {
                        max_persistence_pairs = data[i]
                    }
                }
            }
             
             let vData = [] ;

             let testData = [] ;
            
             // for threshold = iComponents
             for (var i = 0; i < w; i ++ ) {
                testData.push( 0 ) ;
             }

             // extract related information
             for (let i = 0; i < h; i ++ ) {
                 for (let j = 0; j < w; j ++ ) {
                     let idx = ( i * w + j ) * nComponents  + iComponent;
                     let dd =  data[ idx ] ;
                     testData[j] += dd ;
                     let items = data.slice(( i * w + j ) * nComponents, ( i * w + j ) * nComponents + nComponents)
                     // (x-axis, y-axis, current value, tuples values, current_index, reliability)
                     vData.push([j + "", i + "", dd, items, idx, calculateReliability(items, iComponent)]) ;
                 }
             }

             console.log("PPI: " + iComponent + ", sum up columns:" + testData) ;

             svg.append("g")
                 .attr("width", width)
                 .call(d3.axisBottom(x));
         
             let y = d3.scaleBand()
                 .range([ width * h / w - thx, 0 ])
                 .domain(myVars)
                 .padding(0.01);
         
             svg.append("g")
                 .call(d3.axisLeft(y));
         
             //console.log("extent", extent, "data", vData) ;
             svg.selectAll()
                 .data(vData, function(d) {return "" ; })
                 .enter()
                 .append("rect")
                 .attr("class", "bin")
                 .style("stroke-width", 0.2)
                 .style("stroke", "black")
                 .attr("x", function(d) {
                     return x(d[0]);
                 })
                 .attr("y", function(d) {
                     return y(d[1])
                 })
                 .attr("width", x.bandwidth() )
                 .attr("height", y.bandwidth() )
                 .style("fill", function(d) {
                     return customColor(d[5], d[2], max_persistence_pairs) ;
                 })
                 .on("mouseover", function(d, i){
                     d3.select("#tooltipSvg").selectAll("*").remove();
                     drawLine("tooltipSvg", d[3], iComponent, d[5], max_persistence_pairs, d[2]) ;
                     return d3.select("#tooltip").style("visibility", "visible");
                 })
                 .on("mousemove", function(){
                    return d3.select("#tooltip").style("top", (event.pageY-10)+"px").style("left",(event.pageX+10)+"px");
                 })
                 .on("mouseout", function(){
                     return d3.select("#tooltip").style("visibility", "hidden");
                 })
                 .on("click", function(d, i) {
                     d3.selectAll(".bin").style("stroke", "") ;
                     d3.select(this).style("stroke", "black").style("stroke-width", "2") ;
                     if (!DEV) {
                        // send the empty unStructuredGrid with field data
                        var m = Math.floor(Math.random() * 10);
                        socket.send('updateUnstructuredGrid:{"PointData": {"Elevation": [1.5636609792709351, 2.7696723341941833, 0.23032766580581665, 0.43633899092674255, 0.5636609792709351, 0.7696723341941833, 0.23032766580581665, 0.43633899092674255, 0.5636609792709351, 0.7696723341941833, 0.23032766580581665, 0.43633899092674255], "Result": [2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2]}, "pointCoords": [-0.525731086730957, 0.8506507873535156, 0, 0.525731086730957, 0.8506507873535156, 0, -0.525731086730957, -0.8506507873535156, 0, 0.525731086730957, -0.8506507873535156, 0, 0, -0.525731086730957, 0.8506507873535156, 0, 0.525731086730957, 0.8506507873535156, 0, -0.525731086730957, -0.8506507873535156, 0, 0.525731086730957, -0.8506507873535156, 0.8506507873535156, 0, -0.525731086730957, 0.8506507873535156, 0, 0.525731086730957, -0.8506507873535156, 0, -0.525731086730957, -0.8506507873535156, 0, '+m+'], "CellData": {"Result": [4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4]}, "connectivityList": [3, 0, 11, 5, 3, 0, 5, 1, 3, 0, 1, 7, 3, 0, 7, 10, 3, 0, 10, 11, 3, 1, 5, 9, 3, 5, 11, 4, 3, 11, 10, 2, 3, 10, 7, 6, 3, 7, 1, 8, 3, 3, 9, 4, 3, 3, 4, 2, 3, 3, 2, 6, 3, 3, 6, 8, 3, 3, 8, 9, 3, 4, 9, 5, 3, 2, 4, 11, 3, 6, 2, 10, 3, 8, 6, 7, 3, 9, 8, 1], "FieldData": {"i": ['+d[0]+'], "j": ['+d[1]+'], "v": ['+d[2]+']}}') ;
                     }
                 });
         }

         $('#exampleModal').on('show.bs.modal', function (event) {
           $("#x-y-range-change").val($("#notification_xxyy").text()) ;

         function drawLine(key, data, iComponent, reliability, max_persistence_pairs, pp) {
             let svg = d3.select("#" + key) ;
             let x = d3.scaleLinear().range([0, 240]);
             let y = d3.scaleLinear().range([132, 0]);
         
             let dl = d3.line()
                 .x(function( d,i ) {
                     return x(i * Window.persistence_num / Window.magnitude_num);
                 })
                 .y(function(d) {
                     return y(d);
                 });
         
             // Scale the range of the data
             x.domain(d3.extent(data, function(d, i) {
                 return i * Window.persistence_num / Window.magnitude_num;
             })).nice();
         
             y.domain([0, d3.max(data, function(d) {
                 return d;
             })]);
         
             // Add the drawLine path.
             svg.append("path")
                 .attr("class", "line2")
                 .attr("d", dl(data))
                 .style("stroke-width", 2)
                 .style("stroke", "red")
                 .attr("transform", "translate(28" + ", 4" + ")");
         
             svg.append("line")
                 .attr("class", "zero")
                 .attr("x1", x(iComponent * Window.persistence_num / Window.magnitude_num))
                 .attr("y1", 0)
                 .attr("x2", x(iComponent * Window.persistence_num / Window.magnitude_num))
                 .attr("y2", 136)
                 .style("stroke", "green")
                 .style("stroke-width", 5)
                 .attr("transform", "translate(28, 0)");

             svg.append("text")
                .attr("x", 132)             
                .attr("y", 16)
                .attr("text-anchor", "middle")  
                // sans-serif font-family, size 16px, bolded, and underlined
                .style("font-size", "12px") 
                .style("font-family", "sans-serif") 
                .text("reliability: "+ reliability.toFixed(2) + ", max_PP: " + max_persistence_pairs + ", PP: " + pp);
         
             svg.append("g")
                 .attr("transform", "translate(28, 136)")
                 .call(d3.axisBottom(x));
         
             // Add the Y Axis
             svg.append("g")
                 .attr("transform", "translate(28" + ", 4" + ")")
                 .call(d3.axisLeft(y));
         }

         $("#save-xy-axis").click(function() {

         function objectCallback(msg) {
             if (msg.hasOwnProperty("FieldData") && msg.FieldData.hasOwnProperty("PersistenceCurves")) {
                 $("#box_dataviz").html("") ;
                 $("#box_dataviz_total").html("") ;         
                 drawCurve(msg.FieldData.PersistenceCurves.NumberOfComponents, msg.FieldData.PersistenceCurves.Values) ;
        
                 Window.persistence_num = msg.FieldData.PersistenceCurves.NumberOfComponents ;
                 $("[name='box_line']").attr("visibility", "hidden"); 
                 $("[name='box_box']").attr("visibility", "hidden"); 
                 $("#hidden-notification_xxyy").click() ;
                 $("#customSwitches--y").click();
             }
         
             if (msg.hasOwnProperty("structureType")) {
                 Window.msg = msg ;
                 let name = "" ;
                 if (msg.structureType.Values[0] === 2) {
                     console.log("This is a ttkImageData") ;
                     $("#s1").html("") ;
                     $("#s2").html("") ;
                     if (msg.hasOwnProperty("PointData")) {
                        for (let v in msg.PointData) {
                            name = v ;
                            $('#s1').html('<option value='+v+'>'+v+'</option>');
                            if (msg['PointData'][v].hasOwnProperty("NumberOfComponents")) {
                                if (msg['PointData'][v].NumberOfComponents > 1) {
                                    Window.magnitude_num = msg['PointData'][v].NumberOfComponents ; 
                                    $("#s2").html("") ;
                                    for (let vv = 0; vv < msg['PointData'][v].NumberOfComponents; vv ++) {
                                        $('#s2').append('<option class="histogram-selector" value='+vv+'>'+vv+'</option>');
                                    }
                                }
                            }
                        }
                     }
                     Window.nameX = name ;
                     $("#s1").attr("disabled", "disabled") ;
                     if (DEV) {
                        renderHistogram(msg['Extent'].Values,
                                        msg['PointData'][name].Values,
                                        msg['PointData'][name].NumberOfComponents,
                                        0,
                                        null);   
                     } else {
                        renderHistogram(msg['Extent'].Values,
                                     msg['PointData'][name].Values,
                                     msg['PointData'][name].NumberOfComponents,
                                     0,
                                     ttk.getSocketObject());
                     }
                     
         
         
                 } else if (msg.structureType.Values[0] === 1) {
                     console.log("This is a ttkUnstructuredGrid") ;
                 } else {
                 }
                 console.log( msg ) ;
             }
         }
         
         $("#s2").change(function () {
                 $( "#s2 option:selected" ).each(function() {
                     if (DEV) {
                        renderHistogram(Window.msg['Extent'].Values,
                                     Window.msg['PointData'][Window.nameX].Values,
                                     Window.msg['PointData'][Window.nameX].NumberOfComponents,
                                     parseInt($( this ).text()),

                     } else {
                        renderHistogram(Window.msg['Extent'].Values,

                                     Window.msg['PointData'][Window.nameX].NumberOfComponents,
                                     parseInt($( this ).text()),
                                     ttk.getSocketObject()) ;
                     }
                     
                 });
             })

         let ttk, ttk3 ;
         
         function Connect() {
             DEV = false ;
             var btn = $("#connect") ;
             btn.html('<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>Loading...')
             btn.attr("disabled", true) ;
             let PORT = parseInt(document.getElementById("msg").value) ;
             ttk = new ttkWebSocketIO(PORT,
                 function() { 
                     console.log("on_open") ; 
                 },
                 function() { 
                     alert("check if listening port is available")
                     console.log("on_error") ; 
                     btn.html('Connect') ;
                     btn.attr("disabled", false) ;
                 },
                 function(msg) { // do what you want for on_message
                     console.log("browser receives a msg:", msg) ;
                     btn.html('Connect') ;
                     $("#load_test").attr("disabled", true) ;
                     // btn.attr("disabled", false) ;
                 },
                 function() { 
                     console.log("on_close") ; 
                 },
                 objectCallback,
                 ip="127.0.0.1") ;
         }

                if ($(this).val().replace(" ", "") == "") {
                    $("#s2").val("0").change() ;
                    $(".histogram-selector").prop("disabled", false) ;
                    d3.select(".optimal-threshold").remove() ;
                } else if (isNaN($(this).val())) {
                    alert("this is not valid number");
                } else {
                    // interaction with histogram View
                    if(Window.persistence_num && Window.magnitude_num) {
                        let v = Math.ceil(parseFloat($(this).val()) / ( Window.persistence_num / Window.magnitude_num)) ;
                        $(".histogram-selector").each(function() {
                            if (parseInt($(this).val()) < v) {
                                $(this).prop("disabled", true) ;
                            } else {
                                $(this).prop("disabled", false) ;
                            }
                        }) ;
                        $("#s2").val("" + v).change() ;
                        $("#hidden-optimal-threshold").click() ;
                    }
                }
            }
        });
      </script>
   </body>
</html>
