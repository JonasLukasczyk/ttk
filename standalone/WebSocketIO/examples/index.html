<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <title>ttkWebSocket library examples</title>
      <script type="text/javascript" src="../js/ttkWebSocket.js"></script>
      <script type="text/javascript" src="./js/jquery.min.js"></script>
      <script type="text/javascript" src="./js/bootstrap.min.js"></script>
      <link rel="stylesheet" href="./css/bootstrap.min.css">
   </head>
   <body>
      <div >
         <div class="container">

            <h2 style="padding-top: 20px;" class="pb-3">ttkWebSocket library examples</h2>
            <div class="row">
               <div class="col">
                  <h4> To receive <code>ImageData</code></h4>
                  <div class="text-justify p-2 border bg-light">
                     WebSocket Port:
                     <input id="msg-i" type="text" value="9285">
                     <button id="connect-i" onclick="ConnectI();" class="btn btn-primary btn-sm">Connect</button>
                      <button id="request-i" onclick="RequestI();" class="btn btn-primary btn-sm">Request Data</button>
                      <button id="close-i" onclick="CloseI();" class="btn btn-primary btn-sm">Close</button>

                      <br> Message:
                        <br>
                        <textarea id="txt-i" style="width: 100%;" type="text"></textarea>
                        <br>
                        <button id="send-i" onclick="SendI();" class="btn btn-primary btn-sm" style="float:right;">Send</button>
                     <br>
                  </div>
               </div>
            </div>

            <hr>
            <div class="row">
               <div class="col">
                  <h4> To receive <code>UnstructuredGrid</code></h4>
                  <div class="text-justify p-2 border bg-light">
                     WebSocket Port:
                     <input id="msg-u" type="text" value="9286">
                     <button id="connect-u" onclick="ConnectU();" class="btn btn-primary btn-sm">Connect</button>
                     <button id="request-u" onclick="RequestU();" class="btn btn-primary btn-sm">Request Data</button>
                     <button id="close-u" onclick="CloseU();" class="btn btn-primary btn-sm">Close</button>

                     <br> Message:
                     <br>
                     <textarea id="txt-u" style="width: 100%;" type="text">updateUnstructuredGrid:{"PointData": {"Elevation": [1.5636609792709351, 2.7696723341941833, 0.23032766580581665, 0.43633899092674255, 0.5636609792709351, 0.7696723341941833, 0.23032766580581665, 0.43633899092674255, 0.5636609792709351, 0.7696723341941833, 0.23032766580581665, 0.43633899092674255], "Result": [2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2]}, "pointCoords": [-0.525731086730957, 0.8506507873535156, 0, 0.525731086730957, 0.8506507873535156, 0, -0.525731086730957, -0.8506507873535156, 0, 0.525731086730957, -0.8506507873535156, 0, 0, -0.525731086730957, 0.8506507873535156, 0, 0.525731086730957, 0.8506507873535156, 0, -0.525731086730957, -0.8506507873535156, 0, 0.525731086730957, -0.8506507873535156, 0.8506507873535156, 0, -0.525731086730957, 0.8506507873535156, 0, 0.525731086730957, -0.8506507873535156, 0, -0.525731086730957, -0.8506507873535156, 0, 0.525731086730957], "CellData": {"Result": [4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4]}, "connectivityList": [3, 0, 11, 5, 3, 0, 5, 1, 3, 0, 1, 7, 3, 0, 7, 10, 3, 0, 10, 11, 3, 1, 5, 9, 3, 5, 11, 4, 3, 11, 10, 2, 3, 10, 7, 6, 3, 7, 1, 8, 3, 3, 9, 4, 3, 3, 4, 2, 3, 3, 2, 6, 3, 3, 6, 8, 3, 3, 8, 9, 3, 4, 9, 5, 3, 2, 4, 11, 3, 6, 2, 10, 3, 8, 6, 7, 3, 9, 8, 1], "FieldData": {"as": [1, 2, 32], "bs": [2, 3, 45]}}</textarea>
                     <br>
                     <button id="send-u" onclick="SendU();" class="btn btn-primary btn-sm" style="float:right;">Send</button>
                     <br>
                  </div>
               </div>
            </div>

         </div> <!-- container -->
      </div>

      <script>

         let ttkI;
         function objectCallbackI(obj) {
             console.log("[callback information] browser receives a ImageData object: ", obj) ;
         }

         function ConnectI() {
            let PORT = parseInt(document.getElementById("msg-i").value) ;
            ttkI = new ttkWebSocketIO(PORT,
                 function() { 
                     console.log("on_open") ; 
                 },
                 function() { 
                     alert("check if listening port is available") ;
                 },
                 function(msg) { // do what you want for on_message
                     console.log("browser receives a ImageData msg:", msg) ;
                 },
                 function() { 
                     console.log("on_close") ; 
                 },
                 objectCallbackI) ;
         }
         
         function RequestI() {
             if (ttkI)
                ttkI.send("requestData") ;
         }
         
         function CloseI() {
             if (ttkI)
                ttkI.close() ;
         }
         
         function SendI() {
             if (ttkI)
                ttkI.send(document.getElementById("txt-i").value) ;
         }

         // =====================================================================================================
         let ttkU;
         function objectCallbackU(obj) {
            console.log("[callback information] browser receives an UnstructuredGrid object: ", obj) ;
         }

         function ConnectU() {
            let PORT = parseInt(document.getElementById("msg-u").value) ;
            ttkU = new ttkWebSocketIO(PORT,
                    function() {
                       console.log("on_open") ;
                    },
                    function() {
                       alert("check if listening port is available") ;
                    },
                    function(msg) { // do what you want for on_message
                       console.log("browser receives an UnstructuredGrid msg:", msg) ;
                    },
                    function() {
                       console.log("on_close") ;
                    },
                    objectCallbackU) ;
         }

         function RequestU() {
            if (ttkU)
               ttkU.send("requestData") ;
         }

         function CloseU() {
            if (ttkU)
               ttkU.close() ;
         }

         function SendU() {
            if (ttkU)
               ttkU.send(document.getElementById("txt-u").value) ;
         }
      </script>
   </body>
</html>
