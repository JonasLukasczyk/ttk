[tool.cibuildwheel]
build = "cp312-manylinux_x86_64"
manylinux-x86_64-image = "ttk-manylinux2014:boost-1.86"

before-all = "bash /project/packaging/prepare-vtk-sdk.sh"
repair-wheel-command = """
VTK_EXCLUDES=$(
  find /opt/vtk-sdk \
    -type f \
    -name 'libvtk*.so*' \
    -printf '%f\n' \
  | sort -u \
  | sed 's/^/--exclude /' \
  | tr '\\n' ' '
)

echo "VTK auditwheel excludes:"
echo "$VTK_EXCLUDES"

auditwheel repair \
  $VTK_EXCLUDES \
  -w {dest_dir} \
  {wheel}
"""

