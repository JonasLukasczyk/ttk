[build-system]
requires = [
    "scikit-build-core>=0.11",
    "vtk-sdk-python-wheel-helper>=1.0.5",
]
build-backend = "scikit_build_core.build"

[project]
name = "ttk"
version = "1.4.0.dev0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "vtk==9.6.2",
]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.reproducible = true

[tool.scikit-build.cmake.define]

TTK_BUILD_VTK_WRAPPERS = true
TTK_BUILD_PARAVIEW_PLUGINS = false
TTK_BUILD_STANDALONE_APPS = false

VTK_DIR = "/opt/vtk-sdk/vtk-9.6.2.data/headers/cmake"
Boost_DIR = "/opt/boost/lib/cmake/Boost-1.86.0"

CMAKE_CXX_FLAGS = "-D_GLIBCXX_USE_CXX11_ABI=0"

CMAKE_INSTALL_RPATH = "$ORIGIN;$ORIGIN/../lib64;$ORIGIN/../vtkmodules"

# ---------------------------------------------------------------------------
# TTK VTK modules
